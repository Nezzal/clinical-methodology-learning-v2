name: Build Linux App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Permet de lancer le build manuellement depuis l'interface GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build Next.js & Copy Assets
      run: npm run electron:build

    - name: Package with Electron Builder
      run: npx electron-builder build --linux AppImage deb --publish never

    - name: Upload Linux AppImage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RECIF-MethodoClinique-Linux-AppImage
        path: dist/*.AppImage
        if-no-files-found: error

    - name: Upload Linux DEB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RECIF-MethodoClinique-Linux-DEB
        path: dist/*.deb
        if-no-files-found: error
