name: Build Linux App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y fakeroot dpkg libarchive-tools

    - name: Install dependencies
      run: npm install

    - name: Build Next.js & Copy Assets
      run: npm run electron:build

    - name: Package with Electron Builder
      run: npx electron-builder build --linux AppImage deb --publish never

    - name: Upload Linux AppImage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RECIF-MethodoClinique-Linux-AppImage
        path: dist/*.AppImage
        if-no-files-found: warn

    - name: Upload Linux DEB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RECIF-MethodoClinique-Linux-DEB
        path: dist/*.deb
        if-no-files-found: warn

    - name: Release to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist/*.AppImage
          dist/*.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
